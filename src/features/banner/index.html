<!doctype html>
<html lang="zh-CN" data-window="banner">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-title-key="app.title">LuminaTiles</title>
    <link rel="stylesheet" href="../../shared/styles/fonts.css" />
    <link rel="stylesheet" href="../../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../../shared/styles/theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // 种子写入前先藏起内容，避免首帧闪默认色。
      document.documentElement.dataset.themePending = "";
    </script>
    <script type="module" src="../../main.js"></script>
  </head>
  <body>
    <section class="banner" data-banner data-state="idle">
      <div class="banner__queue" data-banner-queue data-empty="true" role="status">
        <span class="banner__glyph" aria-hidden="true"></span>
        <span class="banner__queue-count" data-banner-queue-count>0</span>
      </div>
      <div class="banner__slots" data-banner-slots></div>
    </section>
  </body>
</html>
